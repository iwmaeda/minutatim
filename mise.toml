# `mise run <task>` is the public task API; package.json scripts are the
# implementation layer.
[tools]
node = "24"

[tasks.format]
description = "Rewrite every supported file with Prettier"
run = "npm run format"

[tasks.check]
description = "Every gate that runs offline"
run = "npm run check:all"

[tasks.lint]
description = "Markdown lint"
run = "npm run lint"

[tasks.validate]
description = "Schemas compile; every fixture is judged as declared; the test glob covers every test file"
run = "npm run validate"

[tasks.test]
description = "Unit tests"
run = "npm test"

[tasks.install]
description = "Install npm dependencies from the lockfile"
run = "npm ci"

[tasks.audit]
description = "Fail on known high-severity vulnerabilities"
run = "npm run audit"

[tasks.ci]
description = "Clean install, every gate, then the audit"
run = [{ task = "install" }, { task = "check" }, { task = "audit" }]
